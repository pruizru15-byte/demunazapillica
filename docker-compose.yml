services:
  # -------------------------------------------------------------
  # 1. Frontend SPA (React + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demuna_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - api

  # -------------------------------------------------------------
  # 2. Backend REST API (PHP 8.1 + Apache)
  # -------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demuna_api
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=sistdemuna
      - DB_USER=root
      - DB_PASS=demuna2026
      - JWT_SECRET=super_secret_jwt_key_demuna_2026_sapillica
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - MAIL_MAILER=smtp
      - MAIL_HOST=mail.popydev.com
      - MAIL_PORT=465
      - MAIL_USERNAME=datossistema@popydev.com
      - MAIL_PASSWORD=Piero2004@
      - MAIL_ENCRYPTION=ssl
      - MAIL_FROM_ADDRESS=datossistema@popydev.com
      - MAIL_FROM_NAME="DEMUNA Perú - Sistema de Gestión"
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # 3. Base de Datos (MySQL 8.0)
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: demuna_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: demuna2026
      MYSQL_DATABASE: sistdemuna
    ports:
      - "3307:3306"
    volumes:
      - demuna_db_data:/var/lib/mysql
      - ./backend/database/sistdemuna.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdemuna2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # 4. Gestor de Base de Datos Visual (phpMyAdmin)
  # -------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: demuna_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: demuna2026
    depends_on:
      - db

volumes:
  demuna_db_data:
