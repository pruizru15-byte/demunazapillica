---
deployment:
  tasks:
    - export DEPLOYPATH=/storage/popydev/public_html/demuna
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/api
    - /bin/cp -R frontend/dist/* $DEPLOYPATH/
    - /bin/cp frontend/dist/.htaccess $DEPLOYPATH/.htaccess
    - /bin/cp backend/public/index.php $DEPLOYPATH/api/index.php
    - /bin/cp backend/public/.htaccess $DEPLOYPATH/api/.htaccess
    - /bin/cp -R backend/src $DEPLOYPATH/api/
    - /bin/cp -R backend/config $DEPLOYPATH/api/
    - /bin/chmod 755 $DEPLOYPATH
    - /bin/chmod 755 $DEPLOYPATH/api
    - /bin/chmod -R 755 $DEPLOYPATH/assets
